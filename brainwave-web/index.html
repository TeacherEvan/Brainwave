<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainwave</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="game-container" role="application" aria-label="Brainwave Counting Game">
        <div id="welcome-screen" class="screen" role="region" aria-label="Welcome Screen">
            <h1>Brainwave</h1>
            <button id="start-button" aria-label="Start the Brainwave game">Start Game</button>
        </div>
        <div id="instructions-screen" class="screen" style="display: none;" role="region" aria-label="Instructions Screen">
            <h2>Instructions</h2>
            <p>Click on the planets to make them disappear. After they are all gone, you will be asked how many planets there were.</p>
            <button id="play-button" aria-label="Begin playing the game">Play</button>
        </div>
        <div id="game-screen" class="screen" style="display: none;" role="region" aria-label="Game Screen">
            <div id="game-ui" aria-label="Game statistics">
                <div id="score" aria-label="Current score">Score: 0</div>
                <div id="lives" aria-label="Remaining lives">Lives: 3</div>
            </div>
            <div id="planet-area" aria-live="polite"></div>
            <div id="question-modal" style="display: none;" role="dialog" aria-modal="true" aria-label="Counting question">
                <h2 id="question-heading">How many planets were there?</h2>
                <div id="answer-options" role="group" aria-labelledby="question-heading"></div>
            </div>
        </div>
        <div id="game-over-screen" class="screen" style="display: none;" role="region" aria-label="Game Over Screen">
            <h2>Game Over</h2>
            <p>Enter your name:</p>
            <input type="text" id="player-name" maxlength="20" aria-label="Enter your name">
            <button id="submit-score-button" aria-label="Submit your name and score">Submit</button>
        </div>
    </div>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/game.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
